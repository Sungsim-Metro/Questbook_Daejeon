# Questbook baseline 웹-앱 서버 HTTP API 계약이다.
openapi: 3.1.0
info:
  title: Questbook Daejeon Baseline API
  version: 0.1.0
  description: 사용자 PWA와 앱 API 사이의 baseline 계약이다.
servers:
  - url: http://127.0.0.1:8000
    description: 로컬 웹 게이트웨이
paths:
  /api/auth/providers:
    get:
      summary: 사용 가능한 로그인 provider와 설정 상태를 반환한다.
      responses:
        "200":
          description: provider 목록
  /api/auth/demo-login:
    post:
      summary: 로컬 baseline 검증용 demo-social 로그인과 필수 동의 기록을 처리한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ageConfirmed, privacyConsent, locationConsent]
              properties:
                providerUserId:
                  type: string
                displayName:
                  type: string
                ageConfirmed:
                  type: boolean
                privacyConsent:
                  type: boolean
                locationConsent:
                  type: boolean
      responses:
        "200":
          description: Bearer access token과 사용자 동의 상태
  /api/health:
    get:
      summary: 앱 API와 DB 및 캐시 상태를 확인한다.
      responses:
        "200":
          description: 정상 상태
  /api/me:
    get:
      summary: 서버가 식별한 현재 사용자와 진행도를 반환한다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 사용자 요약
  /api/me/preferences:
    patch:
      summary: 인증된 사용자가 관심 카테고리를 직접 선택하거나 해제한다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categories]
              properties:
                categories:
                  type: array
                  maxItems: 6
                  uniqueItems: true
                  description: 빈 배열은 관심사 전체 해제이며 명시적으로 설정한 상태로 저장된다.
                  items:
                    $ref: "#/components/schemas/InterestCategory"
      responses:
        "200":
          description: 저장된 관심사. 이후 로그인과 추천에 즉시 적용된다.
          content:
            application/json:
              schema:
                type: object
                required: [preference]
                properties:
                  preference:
                    $ref: "#/components/schemas/UserPreference"
        "400":
          description: 배열이 아닌 값, 중복 또는 지원하지 않는 카테고리
        "401":
          description: 유효한 인증 토큰 없음
  /api/places/recommendations:
    get:
      summary: 현재 위치와 활동 이력 없이 관심사 기준으로 대전 전체 관광지를 추천한다.
      description: 관심사 일치 장소를 우선하며 같은 그룹은 안정적으로 정렬한다. 관광지 조회로 퀘스트 인스턴스를 생성하지 않는다.
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            default: all
            enum: [all, nature, science, downtown, market, mobility, nightview]
        - name: refresh
          in: query
          schema:
            type: string
            default: "0"
            enum: ["0", "1", "false", "true", "no", "yes"]
      responses:
        "200":
          description: 대전 관광지 추천. 정상 빈 목록은 그대로 반환하고 예시 또는 일부 조회는 cache.sourceStatus로 구분한다.
          content:
            application/json:
              schema:
                type: object
                required: [scope, preference, recommendations, cache, attribution]
                properties:
                  scope:
                    type: string
                    const: daejeon
                  preference:
                    $ref: "#/components/schemas/UserPreference"
                  recommendations:
                    type: array
                    maxItems: 30
                    items:
                      type: object
                      required: [place, score, matchesPreference, reason]
                      properties:
                        place:
                          $ref: "#/components/schemas/TourPlace"
                        score:
                          type: number
                        matchesPreference:
                          type: boolean
                        reason:
                          type: string
                  cache:
                    $ref: "#/components/schemas/RecommendationCache"
                  attribution:
                    type: string
        "400":
          description: 지원하지 않는 카테고리
        "401":
          description: 유효한 인증 토큰 없음
  /api/recommendations:
    get:
      summary: 현재 위치 또는 사용자가 정한 계획 위치 주변의 관광지와 퀘스트 후보를 반환한다.
      security:
        - bearerAuth: []
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            default: nearby
            enum: [nearby, planning]
        - name: lat
          in: query
          required: false
          description: planning 모드에는 필수다. nearby에서 생략하면 기존 기본 좌표를 사용한다.
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          description: planning 모드에는 필수다. NaN 또는 무한대는 허용하지 않는다.
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [all, nature, science, downtown, market, mobility, nightview]
        - name: radiusMeters
          in: query
          required: false
          schema:
            type: integer
            default: 5000
            minimum: 100
            maximum: 20000
      responses:
        "200":
          description: 기존 추천 결과에 mode와 referenceLocation(latitude, longitude, radiusMeters)을 포함한다. 거리는 이 기준 위치에서의 거리이며 실제 GPS를 증명하지 않는다.
        "400":
          description: 잘못된 모드, planning 좌표 누락 또는 범위를 벗어난 좌표
        "401":
          description: 유효한 인증 토큰 없음
  /api/quests/{instanceId}/accept:
    post:
      summary: 추천 퀘스트를 수행하기로 선택한다.
      security:
        - bearerAuth: []
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 수락된 퀘스트 상태
  /api/quests/{instanceId}/complete:
    post:
      summary: GPS 기반 baseline 인증으로 퀘스트 완료를 요청한다.
      security:
        - bearerAuth: []
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                accuracyMeters:
                  type: number
                photoRef:
                  type: string
                  description: Object Storage에 업로드한 사진 증빙 객체 키
      responses:
        "200":
          description: 완료 성공 또는 재시도 가능한 인증 실패
  /api/badges:
    get:
      summary: 전체 뱃지와 사용자 진행 상태를 반환한다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 뱃지 목록
  /api/notes:
    get:
      summary: 완료 퀘스트 기반 모험가의 수첩 기록을 반환한다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 수첩 기록 목록
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdventureNote"
        "401":
          description: 인증이 필요함
  /api/notes/{noteId}:
    patch:
      summary: 현재 사용자의 수첩 기록에 일기 또는 리뷰 내용을 저장한다.
      security:
        - bearerAuth: []
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entryType, title, body]
              additionalProperties: false
              properties:
                entryType:
                  type: string
                  enum: [diary, review]
                title:
                  type: string
                  maxLength: 100
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                rating:
                  description: 리뷰 평점이며 일기에는 null 또는 생략 값을 사용한다.
                  anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 5
                    - type: "null"
      responses:
        "200":
          description: 수정된 수첩 기록
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note:
                    $ref: "#/components/schemas/AdventureNote"
        "400":
          description: 기록 유형, 제목, 본문 또는 평점이 유효하지 않음
        "401":
          description: 인증이 필요함
        "404":
          description: 현재 사용자가 소유한 수첩 기록을 찾을 수 없음
  /api/ggumdori:
    get:
      summary: 꿈돌이 도감과 사용자 해금 상태를 반환한다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 꿈돌이 도감 상태
  /api/naver-map/config:
    get:
      summary: 브라우저에 공개 가능한 NAVER Maps 설정 상태만 반환한다.
      responses:
        "200":
          description: Key ID 설정 여부와 REST 프록시 활성 상태
  /api/object-storage/config:
    get:
      summary: 비밀값 없이 NCP Object Storage 설정 준비 상태를 반환한다.
      responses:
        "200":
          description: endpoint, region, bucket 설정 여부, presigned URL 정책
  /api/object-storage/upload-url:
    post:
      summary: 사진 증빙 업로드용 Object Storage presigned PUT URL을 발급한다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, contentType]
              properties:
                purpose:
                  type: string
                  enum: [quest_receipt, quest_photo, user_auth_photo]
                contentType:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, image/heic, image/heif]
                questInstanceId:
                  type: string
                  description: quest_receipt와 quest_photo 목적일 때 필수
      responses:
        "200":
          description: 브라우저가 PUT으로 직접 업로드할 URL, headers, objectKey
        "503":
          description: Object Storage 환경 변수가 아직 설정되지 않음
  /api/object-storage/download-url:
    post:
      summary: 본인 사진 증빙 조회용 Object Storage presigned GET을 발급한다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objectKey]
              properties:
                objectKey:
                  type: string
      responses:
        "200":
          description: 짧은 만료 시간의 다운로드 URL
        "401":
          description: 현재 사용자 prefix 밖의 객체 키 요청
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    InterestCategory:
      type: string
      enum: [nature, science, downtown, market, mobility, nightview]
    UserPreference:
      type: object
      required: [categories, distanceRangeMeters, pace, isConfigured]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/InterestCategory"
        distanceRangeMeters:
          type: integer
        pace:
          type: string
        isConfigured:
          type: boolean
          description: 사용자가 관심사를 직접 저장한 적이 있는지 여부. 신규 사용자와 미설정 기존 사용자는 false다.
    TourPlace:
      type: object
      required: [contentId, title, latitude, longitude, categoryCode, categoryName, summary, distanceMeters, source]
      properties:
        contentId:
          type: string
        title:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        categoryCode:
          $ref: "#/components/schemas/InterestCategory"
        categoryName:
          type: string
        summary:
          type: string
        distanceMeters:
          type: [number, "null"]
          description: 대전 전체 추천에서는 거리 기준이 없으므로 null이다.
        source:
          type: string
    RecommendationCache:
      type: object
      required: [hit, sourceStatus, fetchedAt, expiresAt, ttlSeconds]
      properties:
        hit:
          type: boolean
        sourceStatus:
          type: string
          description: live는 실시간 조회, live:partial은 제한 내 일부 조회, fallback으로 시작하면 예시 장소다.
        fetchedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        ttlSeconds:
          type: integer
    AdventureNoteEntry:
      type: object
      required: [type, title, body, rating, updatedAt]
      description: 사용자가 수첩 기록에 직접 작성한 일기 또는 리뷰다.
      properties:
        type:
          type: string
          enum: [diary, review]
        title:
          type: string
          maxLength: 100
        body:
          type: string
          maxLength: 2000
        rating:
          description: 리뷰 평점이며 일기 또는 아직 작성하지 않은 기록은 null이다.
          anyOf:
            - type: integer
              minimum: 1
              maximum: 5
            - type: "null"
        updatedAt:
          description: 사용자가 기록 내용을 마지막으로 저장한 시각이며 미작성 기록은 null이다.
          anyOf:
            - type: string
              format: date-time
            - type: "null"
    AdventureNote:
      type: object
      required:
        - id
        - reusableQuestId
        - questCompletionId
        - questTitle
        - placeName
        - summary
        - earnedXp
        - photoRef
        - entry
        - badges
        - distanceKm
        - shareImageUrl
        - completedAt
        - createdAt
      properties:
        id:
          type: string
        reusableQuestId:
          type: string
        questCompletionId:
          type: string
        questTitle:
          type: string
        placeName:
          type: string
        summary:
          type: string
          description: 퀘스트 완료 시 시스템이 생성한 활동 요약
        earnedXp:
          type: integer
        photoRef:
          description: 비공개 Object Storage에 저장된 사진의 객체 키이며 사진이 없으면 null이다.
          anyOf:
            - type: string
            - type: "null"
        entry:
          $ref: "#/components/schemas/AdventureNoteEntry"
        badges:
          type: array
          items:
            type: string
        distanceKm:
          type: number
        shareImageUrl:
          description: 시스템 생성 공유 카드 경로이며 아직 생성되지 않았으면 null이다.
          anyOf:
            - type: string
            - type: "null"
        completedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
